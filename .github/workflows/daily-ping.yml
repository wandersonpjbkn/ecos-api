# Simulated daily request to your render project so that the service doesn't go down
name: Daily render ping

on:
  schedule:
    - cron: '0 3 * * *' # Runs daily at midnight UTC
  workflow_dispatch: # Allows manual triggering

jobs:
  curl-website:
    runs-on: ubuntu-latest

    steps:
      - name: Keep Supabase auth active
        run: curl -fsS -o /dev/null https://ecos-api.onrender.com/health/keep-alive

      - name: Smoke test books endpoint (Mongo + Render path)
        run: curl -fsS -o /dev/null https://ecos-api.onrender.com/books
